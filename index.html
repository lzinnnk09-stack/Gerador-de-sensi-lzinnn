<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Aim Sense FF</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');

* {
  box-sizing: border-box;
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
}

body {
  margin: 0;
  background: linear-gradient(180deg, #0f172a, #020617);
  color: #fff;
  min-height: 100vh;
  padding: 20px;
}

/* CARD PRINCIPAL */
.app {
  max-width: 420px;
  margin: auto;
  background: rgba(255,255,255,0.06);
  backdrop-filter: blur(20px);
  border-radius: 24px;
  padding: 22px;
  box-shadow: 0 20px 40px rgba(0,0,0,0.4);
}

/* HEADER */
header {
  text-align: center;
  margin-bottom: 20px;
}
header h1 {
  font-size: 24px;
  margin: 0;
}
header p {
  font-size: 13px;
  color: #cbd5f5;
}

/* SELECTS */
select {
  width: 100%;
  padding: 14px;
  border-radius: 16px;
  border: none;
  margin-top: 12px;
  font-size: 15px;
  background: rgba(255,255,255,0.12);
  color: #fff;
  outline: none;
}

/* BOTÃO */
button {
  width: 100%;
  padding: 16px;
  margin-top: 18px;
  border-radius: 18px;
  border: none;
  background: linear-gradient(135deg, #22c55e, #16a34a);
  color: #000;
  font-size: 16px;
  font-weight: 700;
}

/* RESULTADO */
.result {
  margin-top: 20px;
  background: rgba(255,255,255,0.08);
  border-radius: 18px;
  padding: 16px;
  font-size: 15px;
}

/* LINHAS */
.line {
  display: flex;
  justify-content: space-between;
  margin: 6px 0;
}

/* FOOTER */
footer {
  text-align: center;
  margin-top: 16px;
  font-size: 11px;
  color: #94a3b8;
}
</style>
</head>

<body>

<div class="app">

<header>
  <h1>🎯 Aim Sense FF</h1>
  <p>iPhone • Base original FF • Escala 0–200</p>
</header>

<select id="perfil">
  <option value="padrao">🎮 Padrão FF</option>
  <option value="equilibrado">⚖️ Equilibrado</option>
  <option value="capa">🔥 Subir Capa</option>
  <option value="precisao">🎯 Precisão</option>
</select>

<select id="nivel">
  <option value="iniciante">🟢 Iniciante</option>
  <option value="medio">🟡 Intermediário</option>
  <option value="avancado">🔴 Avançado</option>
</select>

<button onclick="gerar()">GERAR SENSI</button>

<div class="result" id="resultado">
  <small>Selecione as opções acima</small>
</div>

<footer>
  Ajuste manual no Free Fire • Não é hack
</footer>

</div>

<script>
function limitar(v) {
  return Math.max(0, Math.min(200, v));
}

function gerar() {

  let perfil = perfil = document.getElementById("perfil").value;
  let nivel  = document.getElementById("nivel").value;

  let s = {
    geral: 176,
    red: 170,
    x2: 150,
    x4: 130,
    awm: 110,
    olho: 120
  };

  if (nivel === "iniciante") {
    s.geral -= 10; s.red -= 10;
  }
  if (nivel === "avancado") {
    s.geral += 8; s.red += 8; s.x2 += 6;
  }

  if (perfil === "equilibrado") {
    s.geral += 4; s.red += 4;
  }
  if (perfil === "capa") {
    s.geral += 10; s.red += 14; s.x2 += 12;
  }
  if (perfil === "precisao") {
    s.x4 -= 8; s.awm -= 8;
  }

  for (let k in s) s[k] = limitar(s[k]);

  document.getElementById("resultado").innerHTML = `
    <div class="line"><span>Geral</span><b>${s.geral}</b></div>
    <div class="line"><span>Red Dot</span><b>${s.red}</b></div>
    <div class="line"><span>Mira 2x</span><b>${s.x2}</b></div>
    <div class="line"><span>Mira 4x</span><b>${s.x4}</b></div>
    <div class="line"><span>AWM</span><b>${s.awm}</b></div>
    <div class="line"><span>Olhadinha</span><b>${s.olho}</b></div>
  `;
}
</script>

</body>
</html>
